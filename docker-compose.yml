services:
  octorr:
    build: .
    container_name: octorr
    extra_hosts:
      - "${TAILNET_HOST}:${HOST_LAN_IP}"
    restart: unless-stopped
    ports:
      - "5274:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production

      # ----- Subsonic / Navidrome upstream -----
      # Required. Your Navidrome server, reachable from THIS container (a LAN IP
      # or service name, not localhost). Left blank on purpose so a missing value
      # is detected and reported clearly instead of silently failing.
      Subsonic__Url: ${SUBSONIC_URL:-}
      # Optional Navidrome admin login. Lets Octo detect the music folder and run
      # authenticated rescans on its own. Leave blank to have Octo learn an admin
      # token from a client sign-in instead.
      Subsonic__AdminUsername: ${SUBSONIC_ADMIN_USERNAME:-}
      Subsonic__AdminPassword: ${SUBSONIC_ADMIN_PASSWORD:-}
      # Auto-detect the download folder from Navidrome so downloads land where it
      # scans. Only adopts a path Octo can actually see; otherwise falls back to
      # Library__DownloadPath below. Set false to always use that path verbatim.
      Subsonic__AutoDetectDownloadPath: ${AUTO_DETECT_DOWNLOAD_PATH:-true}
      Subsonic__StorageMode: ${STORAGE_MODE:-Stream}
      Subsonic__DownloadMode: ${DOWNLOAD_MODE:-Track}
      Subsonic__DownloadOnStar: ${DOWNLOAD_ON_STAR:-true}
      Subsonic__DownloadAlbumOnStar: ${DOWNLOAD_ALBUM_ON_STAR:-true}
      Subsonic__FolderStructure: ${FOLDER_STRUCTURE:-Flat}
      Subsonic__DownloadSource: ${DOWNLOAD_SOURCE:-Soulseek}
      Subsonic__UseLocalStaging: ${USE_LOCAL_STAGING:-false}
      Subsonic__ExplicitFilter: ${EXPLICIT_FILTER:-All}
      Subsonic__CacheDurationHours: ${CACHE_DURATION_HOURS:-1}
      Subsonic__EnableExternalPlaylists: ${ENABLE_EXTERNAL_PLAYLISTS:-false}

      # Where downloaded FLACs land (bind-mount below)
      Library__DownloadPath: /music

      # Where slskd drops finished transfers, before Octo files them into the
      # library. Deliberately OUTSIDE /music: when slskd wrote straight into the
      # library, Navidrome would index a file at the peer's arbitrary folder path
      # before Octo relocated it, leaving a dead row behind and flashing junk
      # albums ("ZABA (2014)", "Punken (1)") into clients mid-download.
      Library__StagingPath: /staging

      # ----- yt-dlp shim sidecar (internal stream-preview source) -----
      YouTube__ShimUrl: http://yt-dlp-shim:8080

      # ----- slskd (Soulseek) sidecar -----
      Soulseek__BaseUrl: http://${HOST_LAN_IP}:5030
      Soulseek__Username: ${SLSKD_USERNAME:-slskd}
      Soulseek__Password: ${SLSKD_PASSWORD:-slskd}
      Soulseek__SearchWaitSeconds: ${SLSKD_SEARCH_WAIT_SECONDS:-6}
      Soulseek__MinFileSizeBytes: ${SLSKD_MIN_FILE_SIZE_BYTES:-5242880}
      Soulseek__PreferredExtension: ${SLSKD_PREFERRED_EXTENSION:-flac}
      Soulseek__DownloadTimeoutSeconds: ${SLSKD_DOWNLOAD_TIMEOUT_SECONDS:-180}

      # ----- Last.fm radio -----
      LastFm__ApiKey: ${LASTFM_API_KEY:-}
      LastFm__EnableRadio: ${LASTFM_ENABLE_RADIO:-true}
      LastFm__RadioTrackCount: ${LASTFM_RADIO_TRACK_COUNT:-50}
      LastFm__RadioCacheDurationHours: ${LASTFM_RADIO_CACHE_HOURS:-24}
    volumes:
      - ${DOWNLOAD_PATH:-./downloads}:/music
      - ${STAGING_PATH:-./staging}:/staging
      # Editable settings file — admin UI writes here, ASP.NET hot-reloads on
      # change. Bind-mounted to host so values survive `docker compose up`.
      - ./octo-config:/app/config
    depends_on:
      - yt-dlp-shim
      - slskd

  # Wraps yt-dlp behind /search and /stream HTTP endpoints. Isolating the binary
  # in its own container prevents .NET process-management quirks from wedging
  # the parent (see Brain/projects/Flaccy.md, 2026-04-29 LXC wedge note).
  yt-dlp-shim:
    build: ./yt-dlp-shim
    container_name: yt-dlp-shim
    restart: unless-stopped
    depends_on:
      - bgutil-pot
    environment:
      # Base URL of the bgutil PO-token provider sidecar below. yt-dlp's
      # bgutil-ytdlp-pot-provider plugin (installed in the shim image) reads
      # this via --extractor-args to fetch PO tokens for the actual
      # googlevideo stream request, which YouTube now requires even when
      # search/resolve metadata calls succeed without one.
      BGUTIL_POT_BASE_URL: http://bgutil-pot:4416
      MAX_CONCURRENT_YTDLP: ${YTDLP_MAX_CONCURRENT:-5}
      SEARCH_CACHE_MAX: ${YTDLP_SEARCH_CACHE_MAX:-1024}
      URL_CACHE_MAX: ${YTDLP_URL_CACHE_MAX:-512}
      URL_CACHE_TTL: ${YTDLP_URL_CACHE_TTL:-3600}
      # Root the /download endpoint may write under (matches the /music mount).
      DOWNLOAD_ROOT: /music
      # Persistent duration cache (SQLite). On the named volume below so resolved
      # "artist - title -> {video_id, duration}" mappings survive container recreate.
      META_DB_PATH: /var/lib/ytshim/meta.db
    expose:
      - "8080"
    volumes:
      # Persist yt-dlp's player/nsig cache so base.js + signature solving is not
      # repeated on every fork, and survives container recreate. Named volume so
      # ownership is correct and `docker compose down` does not touch host paths.
      - ytdlp-cache:/root/.cache/yt-dlp
      # YouTube session cookies (Netscape format) so extraction runs
      # authenticated instead of anonymous - meaningfully faster and less
      # throttled by YouTube's bot detection. Read-only, owner-only perms on host.
      - ./yt-dlp-shim/cookies.txt:/app/cookies.txt
      # Persistent duration cache DB (see META_DB_PATH above).
      - ytshim-cache:/var/lib/ytshim
      # Shared music root so YouTube-MP3 downloads (DownloadSource=YouTube) land
      # where Navidrome scans; same host dir Octo and slskd mount, so dest paths
      # line up across containers.
      - ${DOWNLOAD_PATH:-./downloads}:/music

  # PO-token provider for yt-dlp. YouTube now requires a proof-of-origin
  # token on the actual googlevideo audio-stream request (not just
  # search/resolve), which was causing every /stream call to 403 even
  # though extraction succeeded. This sidecar generates valid tokens that
  # the bgutil-ytdlp-pot-provider plugin (in yt-dlp-shim) fetches over HTTP.
  bgutil-pot:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: bgutil-pot
    restart: unless-stopped
    expose:
      - "4416"

  # Second ProtonVPN tunnel, dedicated to slskd. Separate from the qBittorrent
  # tunnel because Proton's two-port forwarding mode leaves one of the two
  # mappings behind an internal port the firewall never opens; one forwarded
  # port per tunnel is the only arrangement where both apps get working inbound.
  # Provider mode on purpose -- gluetun selects and re-selects a US server on
  # its own, so a single server going down does not take Soulseek with it.
  gluetun-music:
    image: qmcgaw/gluetun:latest
    container_name: gluetun-music
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - SERVER_COUNTRIES=United States
      - PORT_FORWARD_ONLY=on
      - UPDATER_PERIOD=24h
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=10.2.0.2/32
      - DNS_ADDRESS=10.2.0.1
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      - VPN_PORT_FORWARDING_STATUS_FILE=/tmp/gluetun/forwarded_port
      - VPN_PORT_FORWARDING_PORTS_COUNT=1
    # slskd shares this namespace, so its web UI and peer port are published here.
    ports:
      - "5030:5030"
      - "50300:50300"
      - "50300:50300/udp"
    restart: unless-stopped

  # Soulseek client (slskd). Web UI on 5030, peer port 50300.
  # State (config, db, downloads-in-progress) persisted to ./slskd-state so the
  # account survives recreate. Finished transfers land in /staging, which Octo
  # then files into the library — slskd never writes into /music itself.
  # /music is mounted read-only purely so the library can be SHARED for seeding.
  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    restart: unless-stopped
    user: '1000:1000'
    network_mode: "service:gluetun-music"
    depends_on:
      - gluetun-music
    environment:
      SLSKD_REMOTE_CONFIGURATION: "true"
      SLSKD_DOWNLOADS_DIR: /staging
      # Shared dirs are declared in slskd-state/slskd.yml (shares.directories),
      # not here — one source of truth. The share index has retention: ~ (never
      # self-refreshes), so cron re-scans it nightly: slskd-rescan-shares.sh.
      SLSKD_SLSK_USERNAME: ${SLSKD_SOULSEEK_USERNAME:-}
      SLSKD_SLSK_PASSWORD: ${SLSKD_SOULSEEK_PASSWORD:-}
      SLSKD_USERNAME: ${SLSKD_USERNAME:-slskd}
      SLSKD_PASSWORD: ${SLSKD_PASSWORD:-slskd}
    volumes:
      - ./slskd-state:/app
      # Read-only: slskd shares the library for seeding but must never write to
      # it. Downloads go to /staging instead.
      - ${DOWNLOAD_PATH:-./downloads}:/music:ro
      - ${STAGING_PATH:-./staging}:/staging

volumes:
  ytdlp-cache:
  ytshim-cache:
